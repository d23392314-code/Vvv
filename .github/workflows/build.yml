name: Build DEWZX Firmware

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  SKETCH_DIR: DEWZX_VOICE_AI
  SKETCH_NAME: DEWZX_VOICE_AI
  ESP32_CORE: 2.0.17
  FQBN: esp32:esp32:esp32s3:PSRAM=opi,FlashSize=8M,PartitionScheme=huge_app,CPUFreq=240,CDCOnBoot=cdc,FlashMode=qio

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@${ESP32_CORE}

      - name: Install libraries
        run: |
          arduino-cli lib install "Adafruit GFX Library"
          arduino-cli lib install "Adafruit ST7735 and ST7789 Library"
          arduino-cli lib install "ArduinoJson@6.21.5"

      - name: Compile
        run: |
          arduino-cli compile \
            --fqbn "${FQBN}" \
            --output-dir build_out \
            "${SKETCH_DIR}"
          ls -lh build_out

      - name: Buat merged.bin (8MB, siap flash di 0x0)
        run: |
          pip install esptool
          BOOT=$(find ~/.arduino15 -name boot_app0.bin | head -1)
          python -m esptool --chip esp32s3 merge_bin \
            -o build_out/DEWZX_merged_8MB.bin \
            --flash_mode qio --flash_freq 80m --flash_size 8MB \
            --fill-flash-size 8MB \
            0x0     build_out/${SKETCH_NAME}.ino.bootloader.bin \
            0x8000  build_out/${SKETCH_NAME}.ino.partitions.bin \
            0xe000  "$BOOT" \
            0x10000 build_out/${SKETCH_NAME}.ino.bin
          ls -lh build_out/DEWZX_merged_8MB.bin

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: dewzx-firmware
          path: |
            build_out/DEWZX_merged_8MB.bin
            build_out/${{ env.SKETCH_NAME }}.ino.bin
            build_out/${{ env.SKETCH_NAME }}.ino.bootloader.bin
            build_out/${{ env.SKETCH_NAME }}.ino.partitions.bin


