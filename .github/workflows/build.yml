name: Build DEWZX Firmware

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  SKETCH_DIR: DEWZX                 # folder sketch (harus sama dengan nama file .ino -> DEWZX/DEWZX.ino)
  ESP32_CORE: 2.0.17                # core lama, kompatibel dengan driver/i2s.h legacy
  FQBN: esp32:esp32:esp32s3:PSRAM=opi,FlashSize=8M,PartitionScheme=huge_app,CPUFreq=240,CDCOnBoot=cdc

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@${ESP32_CORE}

      - name: Install libraries
        run: |
          arduino-cli lib install "Adafruit GFX Library"
          arduino-cli lib install "Adafruit ST7735 and ST7789 Library"
          arduino-cli lib install "ArduinoJson@6.21.5"

      - name: Compile
        run: |
          arduino-cli compile \
            --fqbn "${FQBN}" \
            --export-binaries \
            --warnings default \
            "${SKETCH_DIR}"

      - name: Kumpulkan hasil
        run: |
          mkdir -p out
          cp ${SKETCH_DIR}/build/*/*.bin out/
          ls -lh out

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: dewzx-firmware
          path: out/*.bin

