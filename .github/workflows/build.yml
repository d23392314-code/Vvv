# Simpan sebagai: .github/workflows/build.yml   (di repo GitHub kamu)
# Struktur repo:   DEWZX_VOICE_AI/DEWZX_VOICE_AI.ino   (nama folder = nama file .ino)
name: Build DEWZX

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2

      - name: Install core ESP32 + library
        run: |
          arduino-cli config init
          arduino-cli config set board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.2.0
          arduino-cli lib install "GFX Library for Arduino"
          arduino-cli lib install "ArduinoJson"

      - name: Daftar opsi board (untuk debug)
        run: arduino-cli board details -b esp32:esp32:esp32s3 | grep -iE "PartitionScheme|PSRAM|FlashSize" || true

      # Board N16R8 (16MB flash + PSRAM octal). Kalau boardmu N8R8: ganti FlashSize=16M menjadi FlashSize=8M
      # Kalau PSRAM-nya QSPI (N8R2/N4R2): ganti PSRAM=opi menjadi PSRAM=enabled
      - name: Compile
        run: |
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32s3:PSRAM=opi,FlashSize=16M,PartitionScheme=default_8MB,CDCOnBoot=default" \
            --output-dir build \
            DEWZX_VOICE_AI

      - uses: actions/upload-artifact@v4
        with:
          name: DEWZX-firmware
          path: build/*.bin
